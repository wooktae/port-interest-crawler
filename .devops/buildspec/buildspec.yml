version: 0.2

env:
  shell: bash
  variables:
    PUSH_ARTIFACT: "false"
    PUSH_IMAGE: "false"
    ARTIFACT_BUCKET: ""
    ARTIFACT_PREFIX: "crawler/windows"
    ECR_REPOSITORY: "portfolio-interest-crawler"
    AWS_DEFAULT_REGION: "ap-northeast-2"

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - set -euo pipefail
      - echo "=== VERIFY BUILD RUNTIME ==="
      - python --version
      - git --version
      - aws --version
      - docker --version

  pre_build:
    commands:
      - set -euo pipefail
      - echo "=== VERIFY SOURCE IDENTITY ==="
      - SOURCE_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - |
        if [ -z "${SOURCE_SHA}" ]; then
          echo "SOURCE_SHA=EMPTY"
          exit 10
        fi
      - SHORT_SHA="$(printf '%s' "${SOURCE_SHA}" | cut -c1-12)"
      - echo "SOURCE_SHA=${SOURCE_SHA}"
      - echo "SHORT_SHA=${SHORT_SHA}"
      - echo "PUSH_ARTIFACT=${PUSH_ARTIFACT}"
      - echo "PUSH_IMAGE=${PUSH_IMAGE}"
      - echo "ECR_REPOSITORY=${ECR_REPOSITORY}"

      - echo "=== RUN PYTHON COMPILE ==="
      - python .devops/scripts/build/compile_check.py

      - echo "=== VERIFY WINDOWS BUNDLE SOURCE CONTRACT ==="
      - test -f .devops/bundle/windows-include.txt
      - test -f ops/run_krx_worker_daily.ps1
      - test -f requirements.txt
      - echo "WINDOWS_BUNDLE_SOURCE_CONTRACT=SUCCESS"

      - echo "=== VERIFY CONTAINER SOURCE CONTRACT ==="
      - test -f Dockerfile
      - test -f .dockerignore
      - test -f interest_crawler_daily_nongui.py
      - python -m py_compile interest_crawler_daily_nongui.py
      - echo "CRAWLER_NONGUI_SOURCE_CONTRACT=SUCCESS"

      - echo "QUALITY_GATE=SUCCESS"

  build:
    commands:
      - set -euo pipefail

      - echo "=== BUILD WINDOWS VERSIONED ZIP ==="
      - python .devops/scripts/package/build_windows_bundle.py --expected-sha "${SOURCE_SHA}"

      - BUNDLE_NAME="port-interest-crawler-windows-${SHORT_SHA}.zip"
      - BUNDLE_PATH=".devops/artifacts/${BUNDLE_NAME}"

      - |
        if [ ! -f "${BUNDLE_PATH}" ]; then
          echo "BUNDLE_FILE_MISSING=${BUNDLE_PATH}"
          exit 20
        fi

      - echo "=== VERIFY WINDOWS BUNDLE CONTRACT ==="
      - python .devops/scripts/test/verify_windows_bundle.py

      - BUNDLE_SHA256="$(sha256sum "${BUNDLE_PATH}" | awk '{print $1}')"

      - echo "BUNDLE_NAME=${BUNDLE_NAME}"
      - echo "BUNDLE_PATH=${BUNDLE_PATH}"
      - echo "BUNDLE_SHA256=${BUNDLE_SHA256}"
      - echo "CRAWLER_WINDOWS_VERSIONED_ZIP_BUILD=SUCCESS"

      - echo "=== BUILD CRAWLER CONTAINER IMAGE ==="
      - ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}"
      - IMAGE_TAG="${SHORT_SHA}"
      - IMAGE_URI="${ECR_URI}:${IMAGE_TAG}"
      - echo "ECR_URI=${ECR_URI}"
      - echo "IMAGE_TAG=${IMAGE_TAG}"
      - echo "IMAGE_URI=${IMAGE_URI}"

      - docker build --pull -t "${IMAGE_URI}" .

      - echo "=== VERIFY CONTAINER NONGUI CONTRACT ==="
      - |
        docker run --rm \
          --entrypoint python \
          "${IMAGE_URI}" \
          -m py_compile /app/interest_crawler_daily_nongui.py

      - echo "CRAWLER_CONTAINER_BUILD=SUCCESS"
      - echo "CRAWLER_CONTAINER_NONGUI_CONTRACT=SUCCESS"

  post_build:
    commands:
      - set -euo pipefail

      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "CRAWLER_CODEBUILD=FAILED_BEFORE_POST_BUILD"
          exit 40
        fi

      - echo "=== OPTIONAL S3 WINDOWS ARTIFACT PUSH ==="

      - |
        if [ "${PUSH_ARTIFACT}" = "true" ]; then
          if [ -z "${ARTIFACT_BUCKET}" ]; then
            echo "ARTIFACT_BUCKET=EMPTY"
            exit 30
          fi

          S3_KEY="${ARTIFACT_PREFIX}/${SOURCE_SHA}/${BUNDLE_NAME}"

          aws s3 cp \
            "${BUNDLE_PATH}" \
            "s3://${ARTIFACT_BUCKET}/${S3_KEY}" \
            --only-show-errors

          aws s3api head-object \
            --bucket "${ARTIFACT_BUCKET}" \
            --key "${S3_KEY}" \
            >/dev/null

          echo "S3_ARTIFACT_KEY=${S3_KEY}"
          echo "S3_ARTIFACT_PUSH=SUCCESS"
        else
          echo "S3_ARTIFACT_PUSH=SKIPPED"
        fi

      - echo "=== OPTIONAL ECR CONTAINER IMAGE PUSH ==="

      - |
        if [ "${PUSH_IMAGE}" = "true" ]; then
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          IMAGE_TAG="${SHORT_SHA}"
          IMAGE_URI="${ECR_URI}:${IMAGE_TAG}"

          echo "PUBLISH_IMAGE_URI=${IMAGE_URI}"

          aws ecr get-login-password \
            --region "${AWS_DEFAULT_REGION}" |
            docker login \
              --username AWS \
              --password-stdin \
              "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

          docker push "${IMAGE_URI}"

          IMAGE_DIGEST="$(
            aws ecr describe-images \
              --region "${AWS_DEFAULT_REGION}" \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids imageTag="${IMAGE_TAG}" \
              --query "imageDetails[0].imageDigest" \
              --output text
          )"

          if [ -z "${IMAGE_DIGEST}" ] || [ "${IMAGE_DIGEST}" = "None" ]; then
            echo "IMAGE_DIGEST=EMPTY"
            exit 50
          fi

          echo "IMAGE_URI=${IMAGE_URI}"
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}"
          echo "ECR_IMAGE_PUSH=SUCCESS"
        else
          echo "ECR_IMAGE_PUSH=SKIPPED"
        fi

      - echo "CRAWLER_CODEBUILD=SUCCESS"

artifacts:
  files:
    - ".devops/artifacts/*.zip"
  discard-paths: yes